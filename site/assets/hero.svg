<svg xmlns="http://www.w3.org/2000/svg" viewBox="-29 -83 74 90" width="74" height="90">
  <!-- BACK LEG -->
  <!-- Silver thigh (backThighX=-14, backFootX=-18, backFootY=0) -->
  <polygon points="-12,-28 -4,-28 -9,-15 -17,-15" fill="#94A3B8" stroke="#060A14" stroke-width="2" stroke-linejoin="round" />
  <rect x="-11" y="-26" width="4" height="8" fill="#E2E8F0" />
  <!-- Blue greave & boot -->
  <polygon points="-18,-17 -8,-17 -6,-5 -21,-5" fill="#1E40AF" stroke="#060A14" stroke-width="2" stroke-linejoin="round" />
  <!-- Armored boot sole & toe -->
  <polygon points="-22,-6 -4,-6 -2,0 -22,0" fill="#172554" stroke="#060A14" stroke-width="2" stroke-linejoin="round" />
  <rect x="-17" y="-15" width="5" height="6" fill="#2563EB" />
  <rect x="-12" y="-4" width="7" height="2" fill="#E2E8F0" />

  <!-- FRONT LEG -->
  <!-- Silver thigh plate (frontThighX=7, frontFootX=10, frontFootY=0) -->
  <polygon points="4,-28 14,-28 18,-16 8,-16" fill="#E2E8F0" stroke="#060A14" stroke-width="2" stroke-linejoin="round" />
  <rect x="7" y="-26" width="4" height="9" fill="#F8FAFC" />
  <!-- Dark mechanical knee joint -->
  <rect x="9" y="-18" width="9" height="4" fill="#475569" />
  <!-- Flared blue greave -->
  <polygon points="8,-16 19,-16 21,-5 7,-5" fill="#2563EB" stroke="#060A14" stroke-width="2" stroke-linejoin="round" />
  <rect x="11" y="-14" width="5" height="7" fill="#60A5FA" />
  <!-- Heavy combat boot -->
  <polygon points="6,-6 25,-6 27,0 6,0" fill="#1E40AF" stroke="#060A14" stroke-width="2" stroke-linejoin="round" />
  <rect x="15" y="-4" width="9" height="2" fill="#E2E8F0" />

  <!-- TORSO & CHEST ARMOR -->
  <polygon points="-9,-32 9,-32 11,-24 -10,-24" fill="#172554" stroke="#060A14" stroke-width="2" stroke-linejoin="round" />
  <rect x="-3" y="-30" width="7" height="4" fill="#94A3B8" />
  <!-- Sculpted silver chestplate -->
  <polygon points="-11,-52 11,-52 13,-41 9,-31 -9,-31 -12,-42" fill="#E2E8F0" stroke="#060A14" stroke-width="2" stroke-linejoin="round" />
  <rect x="-10" y="-49" width="4" height="15" fill="#94A3B8" />
  <rect x="-3" y="-50" width="9" height="6" fill="#F8FAFC" />
  <rect x="1" y="-48" width="8" height="7" fill="#2563EB" stroke="#060A14" stroke-width="1" />
  <rect x="3" y="-47" width="4" height="2" fill="#60A5FA" />

  <!-- Back arm supporting rifle foregrip -->
  <polygon points="5,-47 14,-44 21,-39 17,-36 7,-40" fill="#94A3B8" stroke="#060A14" stroke-width="2" stroke-linejoin="round" />

  <!-- HELMET & HEAD -->
  <polygon points="-11,-70 -4,-75 7,-75 12,-68 12,-53 -11,-53" fill="#2563EB" stroke="#060A14" stroke-width="2" stroke-linejoin="round" />
  <!-- Helmet crest fin & top specular highlight -->
  <polygon points="-3,-76 5,-76 6,-71 -4,-71" fill="#60A5FA" stroke="#060A14" stroke-width="1" stroke-linejoin="round" />
  <rect x="-6" y="-72" width="10" height="3" fill="#BFDBFE" />
  <!-- Side ear-com pod -->
  <rect x="-12" y="-66" width="7" height="10" fill="#1E40AF" stroke="#060A14" stroke-width="1" />
  <rect x="-10" y="-64" width="3" height="6" fill="#E2E8F0" />
  <!-- Dark recessed faceplate & glowing visor -->
  <polygon points="1,-67 12,-66 12,-55 2,-55" fill="#0B1120" stroke="#060A14" stroke-width="1" stroke-linejoin="round" />
  <rect x="4" y="-64" width="7" height="3" fill="#FDE047" />
  <rect x="6" y="-64" width="4" height="2" fill="#FEF9C3" />
  <!-- Silver chin guard -->
  <rect x="2" y="-57" width="9" height="3" fill="#E2E8F0" />

  <!-- FRONT SHOULDER PAULDRON, ARM & PLASMA RIFLE -->
  <polygon points="-14,-53 -2,-55 1,-46 -5,-41 -14,-43" fill="#2563EB" stroke="#060A14" stroke-width="2" stroke-linejoin="round" />
  <rect x="-11" y="-52" width="8" height="3" fill="#60A5FA" />
  <rect x="-10" y="-52" width="5" height="1" fill="#BFDBFE" />

  <!-- Articulated upper/lower arm holding grip -->
  <polygon points="-10,-43 -3,-43 5,-37 14,-39 14,-34 2,-33 -9,-37" fill="#E2E8F0" stroke="#060A14" stroke-width="2" stroke-linejoin="round" />
  <rect x="7" y="-40" width="8" height="6" fill="#1E40AF" stroke="#060A14" stroke-width="1" />

  <!-- Futuristic Long-Barrel Plasma Rifle -->
  <polygon points="4,-44 34,-44 37,-42 37,-37 14,-37 10,-34 4,-35" fill="#1E293B" stroke="#060A14" stroke-width="2" stroke-linejoin="round" />
  <rect x="8" y="-46" width="16" height="3" fill="#475569" />
  <rect x="10" y="-46" width="10" height="1" fill="#94A3B8" />
  <!-- Glowing cyan plasma energy coils & barrel tip -->
  <rect x="16" y="-42" width="12" height="3" fill="#0E7490" />
  <rect x="18" y="-41" width="9" height="2" fill="#22D3EE" />
  <rect x="31" y="-42" width="6" height="4" fill="#22D3EE" />
  <rect x="34" y="-41" width="4" height="2" fill="#ECFEFF" />
</svg>
